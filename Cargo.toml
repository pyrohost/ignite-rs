[package]
name = "ignite-rs"
version = "1.0.0"
authors = ["Pyro Inc."]
edition = "2021"
description = "A more maintained version of deploy-rs meant for mass-scale deployments to hundreds of systems"
license = "MPL-2.0"
repository = "https://github.com/pyrohost/ignite-rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
thiserror = "2.0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
flexi_logger = { version = "0.29", features = ["colors"] }
merge = "0.1"
notify = "8.0.0"
signal-hook = "0.3"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
dirs = "6.0.0"
ratatui = "0.29.0"
crossterm = "0.28.1"
num_cpus = "1.16"
rnix = "0.12.0"
whoami = "1.4"

[lib]
name = "ignite"
path = "src/lib.rs"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
